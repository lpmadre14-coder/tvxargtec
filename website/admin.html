<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TVXARGTEC — Admin Panel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="icon" href="tvxargtec.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link href="css/tv.css" rel="stylesheet">
    <style>
        body { padding: 40px 20px; }
        .admin-wrapper { max-width: 1100px; margin: 0 auto; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; gap: 16px; flex-wrap: wrap; }
        .admin-header h1 { font-size: 1.8rem; font-weight: 950; letter-spacing: -.06em; }
        .admin-header h1 a { color: #fff; text-decoration: none; }
        .back-link { color: var(--muted); font-size: .9rem; text-decoration: none; }
        .back-link:hover { color: #fff; }
        .search-bar { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
        .search-bar input { flex: 1; min-width: 200px; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--border); background: rgba(0,0,0,.25); color: #fff; font-size: .9rem; outline: none; }
        .search-bar input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99,91,255,.15); }
        .search-bar select { padding: 12px 16px; border-radius: 12px; border: 1px solid var(--border); background: rgba(0,0,0,.25); color: #fff; font-size: .9rem; outline: none; cursor: pointer; min-width: 160px; }
        .search-bar select:focus { border-color: var(--primary); }
        .search-bar select option { background: #151927; color: #fff; }
        .cat-group { margin-bottom: 16px; }
        .cat-header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 12px; background: rgba(255,255,255,.06); border: 1px solid var(--border); cursor: pointer; font-weight: 700; font-size: .95rem; color: #e5e7eb; transition: .2s; user-select: none; }
        .cat-header:hover { background: rgba(255,255,255,.1); }
        .cat-header .count { margin-left: auto; color: var(--muted); font-size: .8rem; font-weight: 600; }
        .cat-header .arrow { transition: transform .2s; font-size: .75rem; color: var(--muted); }
        .cat-header.open .arrow { transform: rotate(90deg); }
        .cat-body { display: none; padding: 8px 0 4px 8px; }
        .cat-body.open { display: block; }
        .ch-row { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 8px; transition: .15s; }
        .ch-row:hover { background: rgba(255,255,255,.04); }
        .ch-row .ch-status { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
        .ch-row .ch-status.online { background: var(--green); box-shadow: 0 0 8px rgba(34,197,94,.5); }
        .ch-row .ch-status.offline { background: #ef4444; }
        .ch-row .ch-title { flex: 1; font-size: .88rem; color: #e5e7eb; }
        .ch-row .ch-actions { display: flex; gap: 6px; }
        .ch-row .ch-actions button { padding: 4px 10px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--muted); font-size: .75rem; cursor: pointer; transition: .15s; }
        .ch-row .ch-actions button:hover { color: #fff; border-color: var(--primary); background: rgba(255,255,255,.06); }
        .ch-row .ch-actions button.danger:hover { border-color: #ef4444; color: #fecaca; }
        .result-count { color: var(--muted); font-size: .82rem; margin-bottom: 14px; }
    </style>
</head>
<body>
<div class="admin-wrapper">

    <div class="admin-header">
        <h1><a href="index.html">◆ TVXARGTEC</a> <span style="color:var(--muted);font-weight:400;font-size:1rem">/ Admin</span></h1>
        <a href="index.html" class="back-link">← Volver al inicio</a>
    </div>

    <!-- Admin Login -->
    <div class="admin-login" id="adminLogin">
        <div class="auth-section">
            <h3>🔐 Acceso Administrativo</h3>
            <p>Ingresá tus credenciales de administrador.</p>
            <form class="auth-form" onsubmit="return adminLogin(event)">
                <input type="email" id="adminEmail" placeholder="Email admin" required>
                <input type="password" id="adminPass" placeholder="Contraseña" required>
                <button type="submit" class="btn btn-primary">Ingresar</button>
            </form>
        </div>
    </div>

    <!-- Admin Panel -->
    <div id="adminPanel" style="display:none">
        <div style="display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:2rem">
            <button class="btn btn-primary" onclick="showAdminTab('channels')">📺 Canales</button>
            <button class="btn btn-secondary" onclick="showAdminTab('add')">➕ Añadir Canal</button>
            <button class="btn btn-secondary" onclick="showAdminTab('reports')">📊 Reportes</button>
            <button class="btn btn-outline" onclick="adminLogout()" style="margin-left:auto">🚪 Salir</button>
        </div>

        <!-- Channels tab with search + category groups -->
        <div id="adminChannels" class="admin-tab">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;flex-wrap:wrap;gap:10px">
                <h3 style="font-size:1.3rem">Canales Registrados</h3>
                <button class="btn btn-secondary" onclick="fetchChannels()" style="padding:.5rem 1rem;font-size:.85rem">🔄 Refrescar</button>
            </div>
            <div class="search-bar">
                <input type="text" id="chSearch" placeholder="🔍 Buscar canal por nombre..." oninput="filterChannels()">
                <select id="chCategoryFilter" onchange="filterChannels()">
                    <option value="">Todas las categorías</option>
                </select>
            </div>
            <div id="resultCount" class="result-count"></div>
            <div id="channelsContainer"></div>
        </div>

        <!-- Add Channel tab -->
        <div id="adminAdd" class="admin-tab" style="display:none">
            <div class="auth-section" style="text-align:left">
                <h3>➕ Añadir Canal</h3>
                <p>Completá los datos del nuevo canal.</p>
                <form class="auth-form" onsubmit="return addChannel(event)" style="max-width:100%">
                    <input type="url" id="newUrl" placeholder="URL del stream" required style="flex:100%">
                    <input type="text" id="newTitle" placeholder="Título del canal" required>
                    <div style="display:flex;gap:10px;flex:100%">
                        <input type="text" id="newCategory" placeholder="Categoría (ej: Noticias)" required style="flex:1">
                        <select id="newCategorySelect" onchange="document.getElementById('newCategory').value=this.value" style="flex:1;padding:0 14px;border-radius:999px;border:1px solid var(--border);background:rgba(0,0,0,.22);color:#fff;outline:none;min-height:52px">
                            <option value="">O elegí existente...</option>
                        </select>
                    </div>
                    <input type="url" id="newLogo" placeholder="URL del logo">
                    <button type="submit" class="btn btn-primary" style="flex:100%">Guardar Canal</button>
                </form>
                <div id="addChannelMsg" style="margin-top:1rem;font-size:.9rem"></div>
            </div>
        </div>

        <div id="adminReports" class="admin-tab" style="display:none">
            <h3 style="font-size:1.3rem;margin-bottom:1rem">📊 Reportes de Canales</h3>
            <div id="reportsContent" style="color:var(--muted);padding:2rem 0">Cargando reportes...</div>
        </div>
    </div>

</div>

<script>
let adminToken = '';
let channelsData = [];
let allCategories = [];

function adminLogin(e) {
    e.preventDefault();
    const email = document.getElementById('adminEmail').value;
    const pass = document.getElementById('adminPass').value;
    fetch('https://apitvxargtec.duckdns.org/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password: pass })
    })
    .then(r => r.json())
    .then(data => {
        if (data.token) {
            adminToken = data.token;
            document.getElementById('adminLogin').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
            fetchChannels();
        } else {
            alert('❌ ' + (data.message || 'Credenciales inválidas'));
        }
    })
    .catch(err => alert('❌ Error de conexión: ' + err.message));
    return false;
}

function adminLogout() {
    adminToken = '';
    document.getElementById('adminLogin').style.display = 'block';
    document.getElementById('adminPanel').style.display = 'none';
}

function showAdminTab(tab) {
    document.querySelectorAll('.admin-tab').forEach(t => t.style.display = 'none');
    const map = { channels: 'adminChannels', add: 'adminAdd', reports: 'adminReports' };
    const el = document.getElementById(map[tab]);
    if (el) {
        el.style.display = 'block';
        if (tab === 'reports') fetchReports();
        if (tab === 'channels') filterChannels();
    }
}

async function fetchChannels() {
    const container = document.getElementById('channelsContainer');
    container.innerHTML = '<div style="text-align:center;padding:2rem;color:var(--muted)">Cargando canales...</div>';
    try {
        const res = await fetch('https://apitvxargtec.duckdns.org/api/content');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        channelsData = Array.isArray(data) ? data : (data.channels || data.data || []);
        extractCategories();
        populateCategoryFilter();
        populateCategorySelect();
        filterChannels();
    } catch (err) {
        container.innerHTML = '<div style="text-align:center;padding:2rem;color:var(--crimson)">❌ Error al cargar: ' + err.message + '</div>';
    }
}

function extractCategories() {
    const cats = new Set();
    channelsData.forEach(ch => {
        const c = ch.category || ch.categoryId || ch.group || 'General';
        cats.add(c);
    });
    allCategories = Array.from(cats).sort();
}

function populateCategoryFilter() {
    const sel = document.getElementById('chCategoryFilter');
    const current = sel.value;
    sel.innerHTML = '<option value="">Todas las categorías</option>';
    allCategories.forEach(c => {
        sel.innerHTML += `<option value="${c.replace(/"/g,'&quot;')}">${c}</option>`;
    });
    sel.value = current;
}

function populateCategorySelect() {
    const sel = document.getElementById('newCategorySelect');
    sel.innerHTML = '<option value="">O elegí existente...</option>';
    allCategories.forEach(c => {
        sel.innerHTML += `<option value="${c.replace(/"/g,'&quot;')}">${c}</option>`;
    });
}

function filterChannels() {
    const query = document.getElementById('chSearch').value.toLowerCase().trim();
    const catFilter = document.getElementById('chCategoryFilter').value;
    const container = document.getElementById('channelsContainer');
    const countEl = document.getElementById('resultCount');

    let filtered = channelsData;
    if (query) {
        filtered = filtered.filter(ch => (ch.title || ch.name || '').toLowerCase().includes(query));
    }
    if (catFilter) {
        filtered = filtered.filter(ch => (ch.category || ch.categoryId || ch.group || 'General') === catFilter);
    }

    countEl.textContent = `${filtered.length} canales encontrados`;

    if (!filtered.length) {
        container.innerHTML = '<div style="text-align:center;padding:2rem;color:var(--muted)">No se encontraron canales.</div>';
        return;
    }

    // Group by category
    const groups = {};
    filtered.forEach(ch => {
        const cat = ch.category || ch.categoryId || ch.group || 'General';
        if (!groups[cat]) groups[cat] = [];
        groups[cat].push(ch);
    });

    const sortedCats = Object.keys(groups).sort();
    let html = '';
    sortedCats.forEach(cat => {
        const chs = groups[cat];
        html += `<div class="cat-group">
            <div class="cat-header" onclick="this.classList.toggle('open');this.nextElementSibling.classList.toggle('open')">
                <span class="arrow">▶</span> ${cat} <span class="count">${chs.length}</span>
            </div>
            <div class="cat-body open">`;
        chs.forEach((ch, idx) => {
            const title = ch.title || ch.name || '—';
            const isOnline = (ch.status === true || ch.status === 'online' || ch.status === 'active' || ch.status === 1 || ch.online === true);
            // Find index in original channelsData
            const origIdx = channelsData.indexOf(ch);
            html += `<div class="ch-row">
                <span class="ch-status ${isOnline ? 'online' : 'offline'}"></span>
                <span class="ch-title">${title}</span>
                <span class="ch-actions">
                    <button onclick="editChannelInline(${origIdx})">✎</button>
                    <button class="danger" onclick="deleteChannelInline(${origIdx})">✕</button>
                </span>
            </div>`;
        });
        html += '</div></div>';
    });
    container.innerHTML = html;
}

function editChannelInline(idx) {
    const ch = channelsData[idx];
    const newTitle = prompt('Editar título:', ch.title || ch.name || '');
    if (newTitle && newTitle !== (ch.title || ch.name)) {
        ch.title = newTitle;
        saveChannel(idx);
    }
}

function deleteChannelInline(idx) {
    if (!confirm('¿Eliminar este canal?')) return;
    const ch = channelsData[idx];
    const chId = ch.id || '';
    if (!chId) { channelsData.splice(idx, 1); filterChannels(); return; }
    fetch('https://apitvxargtec.duckdns.org/api/admin/content/' + chId, {
        method: 'DELETE',
        headers: { 'Authorization': 'Bearer ' + adminToken }
    })
    .then(r => r.json())
    .then(data => {
        if (data.code === 200) {
            channelsData.splice(idx, 1);
            filterChannels();
        } else {
            alert('❌ ' + (data.message || 'Error'));
        }
    })
    .catch(err => alert('❌ Error: ' + err.message));
}

async function saveChannel(idx) {
    if (!adminToken) { alert('❌ Sesión expirada'); return; }
    const ch = channelsData[idx];
    const chId = ch.id || '';
    if (!chId) { filterChannels(); return; }
    const title = ch.title || ch.name || '';
    const category = ch.category || ch.categoryId || ch.group || 'General';
    try {
        const res = await fetch('https://apitvxargtec.duckdns.org/api/admin/content/' + chId, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + adminToken },
            body: JSON.stringify({ title, categoryId: category })
        });
        const data = await res.json();
        if (data.code !== 200) alert('❌ ' + (data.message || 'Error al guardar'));
    } catch (err) {
        alert('❌ Error: ' + err.message);
    }
    filterChannels();
}

async function addChannel(e) {
    e.preventDefault();
    if (!adminToken) { alert('❌ Sesión expirada'); return; }
    const msg = document.getElementById('addChannelMsg');
    const url = document.getElementById('newUrl').value;
    const title = document.getElementById('newTitle').value;
    const category = document.getElementById('newCategory').value;
    const logo = document.getElementById('newLogo').value || '';
    try {
        const res = await fetch('https://apitvxargtec.duckdns.org/api/admin/content', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + adminToken },
            body: JSON.stringify({ title, url, logo, categoryId: category })
        });
        const data = await res.json();
        if (data.code === 200) {
            msg.innerHTML = '<span style="color:var(--green)">✅ Canal agregado</span>';
            document.getElementById('newUrl').value = '';
            document.getElementById('newTitle').value = '';
            document.getElementById('newCategory').value = '';
            document.getElementById('newLogo').value = '';
            fetchChannels();
        } else {
            msg.innerHTML = '<span style="color:var(--crimson)">❌ ' + (data.message || 'Error') + '</span>';
        }
    } catch (err) {
        msg.innerHTML = '<span style="color:var(--crimson)">❌ Error: ' + err.message + '</span>';
    }
    setTimeout(() => msg.innerHTML = '', 3000);
    return false;
}

async function fetchReports() {
    const el = document.getElementById('reportsContent');
    el.innerHTML = 'Consultando reportes...';
    if (!adminToken) {
        el.innerHTML = '<div style="text-align:center;padding:2rem;color:var(--crimson)">⚠️ Inicia sesión como admin para ver reportes</div>';
        return;
    }
    try {
        const res = await fetch('https://apitvxargtec.duckdns.org/api/admin/reports', {
            headers: { 'Authorization': 'Bearer ' + adminToken }
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        const reports = data.data || [];
        if (!reports.length) {
            el.innerHTML = '<div style="text-align:center;padding:2rem">No hay reportes registrados.</div>';
            return;
        }
        el.innerHTML = reports.map(r => `
            <div style="background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1rem;margin-bottom:.8rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem">
                <div><strong>Canal: ${r.channelUrl || '—'}</strong><br><span style="font-size:.8rem;color:var(--muted)">Usuario: ${r.userId || '—'}</span></div>
                <span style="font-size:.8rem;color:var(--muted)">${r.reportedAt || ''}</span>
            </div>
        `).join('');
    } catch (err) {
        el.innerHTML = '<div style="text-align:center;padding:2rem;color:var(--muted)">ℹ️ Error al cargar reportes: ' + err.message + '</div>';
    }
}
</script>
</body>
</html>
