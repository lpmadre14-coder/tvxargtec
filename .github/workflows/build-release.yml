name: Build & Release APK

on:
  push:
    tags:
      - 'v*'         # Tags como v1.4.1 disparan release
  workflow_dispatch:  # También se puede ejecutar manualmente

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES" > app/google-services.json

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > app/tvxargtec-release.jks

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Sign APK (verify)
        run: |
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/tvxargtec-${{ github.ref_name }}.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Tvxargtec ${{ github.ref_name }}"
          body: |
            ## Tvxargtec ${{ github.ref_name }}

            ### Cambios
            ${{ github.event.head_commit.message }}
            
            ### Descarga
            APK firmado listo para instalar.
          files: |
            app/build/outputs/apk/release/tvxargtec-${{ github.ref_name }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
